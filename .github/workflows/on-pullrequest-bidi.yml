name: "On Pull Request - Bidirectional Character Scanner"

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/on-pullrequest-bidi.yml"
      - ".github/after-pullrequest-bidi.yml"
      - "bidi-scanner/**/*"
  workflow_dispatch:

permissions: read-all

jobs:
  lint-and-test-cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bidi-scanner/cli
    steps:
      - name: Checkout the Actions repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: bidi-scanner/package-lock.json

      - name: Install dependencies
        run: |
          pushd ..
          npm run ci
          popd

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test:ci

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Test Results
          path: ./bidi-scanner/cli/junit.xml

  lint-lib:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bidi-scanner/lib
    steps:
      - name: Checkout the Actions repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: bidi-scanner/package-lock.json

      - name: Install dependencies
        run: |
          pushd ..
          npm run ci
          popd

      - name: Run linter
        run: npm run lint

  lint-github:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bidi-scanner/github
    steps:
      - name: Checkout the Actions repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: bidi-scanner/package-lock.json

      - name: Install dependencies
        run: |
          pushd ..
          npm run ci
          popd

      - name: Run linter
        run: npm run lint

      - name: Run build
        # Does not save the results - just confirm that the build succeeds
        run: npm run build

  event_file:
    name: Upload Event File
    runs-on: ubuntu-latest
    steps:
    - name: Upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: Event File
        path: ${{ github.event_path }}
